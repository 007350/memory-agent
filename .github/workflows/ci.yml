name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Show resolved versions
        run: pip show fastapi starlette langgraph | grep -E "^(Name|Version):"

      - name: Syntax check
        run: python -m compileall -q backend/app backend/tests

      # Catches "the app won't even start" breakage that unit tests miss:
      # tests import internals, this imports every module including app.main.
      - name: Import smoke test
        working-directory: backend
        env:
          LLM_API_KEY: ci-dummy-key
          LLM_BASE_URL: https://example.invalid/v1
          LIGHTRAG_BASE_URL: http://localhost:9621
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import app
          modules = [m.name for m in pkgutil.walk_packages(app.__path__, prefix="app.")]
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append((name, exc))
          for name, exc in failed:
              print(f"FAILED {name}: {type(exc).__name__}: {exc}")
          print(f"imported {len(modules) - len(failed)}/{len(modules)} modules")
          sys.exit(1 if failed else 0)
          PY

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests/ --ignore=tests/evaluation -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
